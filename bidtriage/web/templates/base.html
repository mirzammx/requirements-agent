<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
{% if refresh %}<meta http-equiv="refresh" content="5">{% endif %}
<title>{% block title %}Bid desk{% endblock %} · Rug-Rel</title>
<style>
{{ css|safe }}
body{font-size:16px}
.wrap{max-width:860px}
h1{font-size:24px;margin:0 0 6px}
h2{font-size:18px;margin:0 0 10px}
.topbar{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.topbar .brand{font-size:18px;font-weight:700;color:var(--text);text-decoration:none;margin-right:16px}
.topbar a.tab{color:var(--muted);text-decoration:none;font-weight:600;padding:8px 14px;border-radius:8px}
.topbar a.tab:hover,.topbar a.tab.active{background:var(--grey-bg);color:var(--text)}
.topbar .spacer{flex:1}
.crumbs{font-size:14px;color:var(--muted);margin:0 0 14px}
.crumbs a{color:var(--muted)}.crumbs .sep{margin:0 6px}
a{color:var(--accent)}
label{display:block;font-weight:600;margin:14px 0 6px}
.hint{font-weight:400;color:var(--muted);font-size:14px}
input[type=text],input[type=url],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);color:var(--text);font:inherit}
textarea{min-height:90px}
input[type=file]{font:inherit}
.btn{display:inline-block;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;
  background:var(--accent);color:#fff;text-decoration:none;line-height:1.3}
.btn.secondary{background:var(--grey-bg);color:var(--text)}
.btn.small{padding:7px 13px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.notice{padding:12px 16px;border-radius:10px;margin-bottom:16px}
.notice.running{background:var(--ask-bg);border:1px solid var(--ask-line)}
.notice.failed{background:var(--high-bg);color:var(--high)}
.notice.info{background:var(--grey-bg)}
.plain{color:var(--muted);margin:4px 0 0}
details.more{margin-top:14px}details.more summary{cursor:pointer;color:var(--muted);font-weight:600}
iframe{width:100%;height:1100px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.inline-form{display:inline}
.btn.chosen{outline:3px solid var(--text);outline-offset:1px}
.buttons{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
/* steps */
.steps{display:flex;list-style:none;margin:0;padding:0;counter-reset:s;flex-wrap:wrap;gap:4px}
.steps li{flex:1;min-width:110px;position:relative;padding:8px 8px 8px 38px;font-size:14px;color:var(--muted)}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:8px;top:7px;width:22px;height:22px;
  border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--grey-bg);color:var(--muted)}
.steps li.done{color:var(--text)}.steps li.done::before{content:"✓";background:var(--ok-bg);color:var(--ok)}
.steps li.current{color:var(--text);font-weight:700}.steps li.current::before{background:var(--accent);color:#fff}
.now{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px;padding:14px 16px;border-radius:10px;
  background:var(--ask-bg);border:1px solid var(--ask-line)}
.now p{margin:0;flex:1;min-width:220px}
/* lists */
.row-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row-item:last-child{border-bottom:0}
.row-item .main{flex:1;min-width:220px}
.row-item .main a{font-weight:600}
.who{font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;background:var(--grey-bg);color:var(--muted);white-space:nowrap}
.who.Mahadevan{background:var(--med-bg);color:var(--med)}.who.BD{background:var(--ok-bg);color:var(--ok)}
.who.Problem{background:var(--high-bg);color:var(--high)}
.status{font-size:13px;color:var(--muted)}
.big-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:16px}
.big-actions .card{margin:0}
</style>
</head>
<body>
<main class="wrap">
<nav class="topbar" aria-label="Main">
  <a class="brand" href="{{ url_for('index') }}">Bid desk</a>
  <a class="tab {{ 'active' if active == 'overview' }}" href="{{ url_for('index') }}">Home</a>
  <a class="tab {{ 'active' if active == 'shortlists' }}" href="{{ url_for('list_shortlists') }}">BidAssist lists</a>
  <a class="tab {{ 'active' if active == 'bids' }}" href="{{ url_for('list_bids') }}">Tenders</a>
  <span class="spacer"></span>
  <a class="btn small" href="{{ url_for('new_bid') }}">+ Add tender</a>
</nav>
{% block crumbs %}{% endblock %}
{% block content %}{% endblock %}
</main>
</body>
</html>
